<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="zk_base_style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <nav class="navbar ZKB_container">
        <div class="navbar__wrapper ZKB_container__wrapper">

            <div class="logo">
                Zikkurat
            </div>
            <div class="navbar__menu">

                <div class="items">
                    <div class="items__item">Товары</div>
                    <div class="items__item">Услуги</div>
                    <div class="items__item">Обратная связь</div>
                    <div class="items__item">Документы</div>
                </div>
                <div class="burger">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="icon icon-tabler icons-tabler-filled icon-tabler-menu-2"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M21 6a1 1 0 0 1 -1 1h-16a1 1 0 1 1 0 -2h16a1 1 0 0 1 1 1" /><path d="M21 12a1 1 0 0 1 -1 1h-16a1 1 0 0 1 0 -2h16a1 1 0 0 1 1 1" /><path d="M21 18a1 1 0 0 1 -1 1h-16a1 1 0 0 1 0 -2h16a1 1 0 0 1 1 1" /></svg>
                </div>

            </div>

        </div>
    </nav>
    
    <div class="navbar_modal navbar_modal--hidden ZKB_modal">

        <div class="ZKB_container ZKB_container--full_screen">
            <div class="ZKB_container__wrapper">

                <div class="navbar_modal__wrapper">
                    <div class="exit">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-x"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M18 6l-12 12" /><path d="M6 6l12 12" /></svg>
                    </div>
                    <div class="items">
                        <div class="items__item">Товары</div>
                        <div class="items__item">Услуги</div>
                        <div class="items__item">Обратная связь</div>
                        <div class="items__item">Документы</div>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- Скрипт открытия/закрытия навбара -->
    <script>
        (()=>{
            const burger = document.querySelector('.navbar .burger');
            const exit   = document.querySelector('.navbar_modal .exit');
            const exitArea = document.querySelector('.navbar_modal .ZKB_container__wrapper');

            const modal = document.querySelector('.navbar_modal');
            const hiddenClass = 'navbar_modal--hidden';

            burger.addEventListener('click', event => {

                modal.classList.remove(hiddenClass);

            });
            exit.addEventListener('click', event => {

                modal.classList.add(hiddenClass);

            });
            exitArea.addEventListener('click', event => {
                if (event.target !== exitArea) return;

                modal.classList.add(hiddenClass);

            });

        })();
    </script>

    <!-- Скрипт адаптивного навбара -->
    <script>
        (()=>{
            const navbar      = document.querySelector('.navbar .items');
            const modalNavbar = document.querySelector('.navbar_modal .items');
            const hiddenClass = 'items__item--hidden';
            
            // Стеки навбара.
            let visibleItemsStack = Array.from(navbar.children);
            let hiddenItemsStack = [];
            // Стеки модального навбара.
            let modalVisibleItemsStack = [];
            let modalHiddenItemsStack = Array.from(modalNavbar.children);
            for (const item of modalHiddenItemsStack) {
                item.classList.add(hiddenClass);
            }

            // Минимальные ширины и гэп.
            // Будут инициализированны в процессе.
            let minWidths = new Map();
            let gap = 0;
            function initMinWidthAndGap() {
                let contentWidth = 0;
                if (visibleItemsStack.length !== 0) {
                    contentWidth = (
                        visibleItemsStack.at(-1).getBoundingClientRect().right -
                        visibleItemsStack.at(0).getBoundingClientRect().left
                    );
                }

                for (const item of visibleItemsStack) {
                    let width = item.getBoundingClientRect().width;
                    
                    minWidths.set(item, width);
                    contentWidth -= width;
                }
                gap = contentWidth / (visibleItemsStack.length - 1);
            }

            // Проверка на переполнение.
            function isOverflow() {
                let navbarWidth = navbar.getBoundingClientRect().width;
                let contentWidth = 0;
                if (visibleItemsStack.length !== 0) {
                    contentWidth = (
                        visibleItemsStack.at(-1).getBoundingClientRect().right -
                        visibleItemsStack.at(0).getBoundingClientRect().left
                    );
                }

                return (
                    navbarWidth < contentWidth &&
                    Math.abs(navbarWidth - contentWidth) > 0.001
                );
            }

            // Проверка возможности сделать видимым один итем.
            function canVisible() {
                // Првоерка на наличие скрытых.
                if (hiddenItemsStack.length === 0) return false;
                let lastHidden = hiddenItemsStack.at(-1);

                // Проверка на вмещаемость скрытого.
                let minItemsWidth = 0;
                for (const item of visibleItemsStack) {
                    minItemsWidth += (minWidths.get(item) + gap);
                }
                minItemsWidth += minWidths.get(lastHidden);

                let navbarWidth = navbar.getBoundingClientRect().width;
                return navbarWidth >= minItemsWidth;
            }

            let observer = new ResizeObserver(() => {
                // Добавляем, либо снимаем класс скрытости.
                if (isOverflow()) (()=>{
                    // Инициализация минимальных ширин и гэпа.
                    // Инициация происходит в момент, когда итемы
                    // имеют наименьший размер.
                    if (minWidths.size === 0) initMinWidthAndGap();

                    // Если произашло переполнение, скрываем один итем из навбара
                    // и проявляем один итем из модального навбара.
                    do {
                        if (visibleItemsStack.length === 0) return;
                        // Берём из стака видимых итем;
                        // Назначаем ему класс скрытости;
                        // Кладём в стак скрытых.
                        let item = visibleItemsStack.pop();
                        item.classList.add(hiddenClass);
                        hiddenItemsStack.push(item);

                        if (modalHiddenItemsStack.length === 0) return;
                        // Берём из стака невидимый итем модальки;
                        // Снимаем с него класс скрытости;
                        // Кладём в стак видимых.
                        let modalItem = modalHiddenItemsStack.pop();
                        modalItem.classList.remove(hiddenClass);
                        modalVisibleItemsStack.push(modalItem);
                    } while (isOverflow());
                })()
                else (()=>{
                    // Если есть возможность, делаем видимым скрытый итем
                    // и скрываем один итем из модального навбара.
                    while (canVisible()) {
                        // Берём из стака невидимый итем;
                        // Снимаем с него класс скрытости;
                        // Кладём в стак видимы.
                        let item = hiddenItemsStack.pop();
                        item.classList.remove(hiddenClass);
                        visibleItemsStack.push(item);

                        if (modalVisibleItemsStack.length === 0) return;
                        // Берём из стака видимых итем модальки;
                        // Назначаем ему класс скрытости;
                        // Кладём в стак скрытых.
                        let modalItem = modalVisibleItemsStack.pop();
                        modalItem.classList.add(hiddenClass);
                        modalHiddenItemsStack.push(modalItem);
                    }
                })();
            });
            observer.observe(navbar);
        })();
    </script>

</body>
</html>
