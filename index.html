<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="zk_base_style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <nav class="navbar ZKB_container">
        <div class="navbar__wrapper ZKB_container__wrapper">

            <div class="logo">
                Zikkurat
            </div>
            <div class="items">
                <div class="items__item">
                    Товары
                </div>
                <div class="items__item">
                    Услуги
                </div>
                <div class="items__item">
                    Обратная связь
                </div>
                <div class="items__item">
                    Документы
                </div>
            </div>
            <div class="burger">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="icon icon-tabler icons-tabler-filled icon-tabler-menu-2"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M21 6a1 1 0 0 1 -1 1h-16a1 1 0 1 1 0 -2h16a1 1 0 0 1 1 1" /><path d="M21 12a1 1 0 0 1 -1 1h-16a1 1 0 0 1 0 -2h16a1 1 0 0 1 1 1" /><path d="M21 18a1 1 0 0 1 -1 1h-16a1 1 0 0 1 0 -2h16a1 1 0 0 1 1 1" /></svg>
            </div>

        </div>
    </nav>
    
    <div class="ZKB_modal" style="display: none;">

        <div class="navbar_modal ZKB_container ZKB_container--full_screen">
            <div class="ZKB_container__wrapper">

                <div class="navbar_modal__wrapper">
                    <div class="exit">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-x"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M18 6l-12 12" /><path d="M6 6l12 12" /></svg>
                    </div>
                    <div class="items">
                        <div class="items__item">
                            Товары
                        </div>
                        <div class="items__item">
                            Услуги
                        </div>
                        <div class="items__item">
                            Обратная связь
                        </div>
                        <div class="items__item">
                            Документы
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>
    
    <script>
        const navBarSelector = '.navbar .items';
        const hiddenSelector = 'items__item--hidden';

        let navbar = document.querySelector(navBarSelector);
        let minWidths = new Map();
        let visibleItemsStack = Array.from(navbar.children);
        let hiddenItemsStack = [];

        let observer = new ResizeObserver((entries) => {
            let navbarEntries = entries[0];
            let navbarWidth = navbar.getClientRects()[0].width;
            
            // Получение общей акруальной ширины итемов без класса скрытости
            let itemsWidth = 0;
            for (const item of visibleItemsStack) {
                let width = item.getClientRects()[0].width;
                itemsWidth += width;
            }

            // Запоминание минимальных размеров итемов
            if (
                navbarWidth < itemsWidth &&
                minWidths.size === 0
            ) {
                for (const item of visibleItemsStack) {
                    let width = item.getClientRects()[0].width;
                    
                    minWidths.set(item, width);
                }
            }

            // Добавляем, либо снимаем класс скрытости
            if (navbarWidth < itemsWidth) {
                // Добавлять класс скрытости для выпадающих
                do {
                    // Берём из стака видимых итем
                    // Назначаем ему класс скрытости
                    // И кладём в стак скрытых

                    if (visibleItemsStack.length === 0) break;
                    let item = visibleItemsStack.pop();
                    let width = item.getClientRects()[0].width;

                    item.classList.add(hiddenSelector);
                    hiddenItemsStack.push(item);
                    itemsWidth -= width;
                } while (navbarWidth < itemsWidth)
            }
            else {
                // Получение минимальной длины итемов без класса скрытости
                let minItemsWidth = 0;
                for (const item of visibleItemsStack) {
                    minItemsWidth += minWidths.get(item);
                }

                // Убирать класс скрытьсти с тех, кого можно вернуть в видимые
                while (true) {
                    // Берём из стака скрытых итем
                    // Проверяем его на возможность вернуть в видимые
                    // Снимаем класс скрытости и кладём в стак видимых

                    if (hiddenItemsStack.length === 0) break;
                    let item = hiddenItemsStack.pop();
                    let minWidth = minWidths.get(item);

                    minItemsWidth += minWidth;
                    if (
                        navbarWidth < minItemsWidth
                    ) {
                        hiddenItemsStack.push(item);
                        break;
                    }

                    item.classList.remove(hiddenSelector);
                    visibleItemsStack.push(item);
                }
            }

        });
        observer.observe(navbar);

    </script>

</body>
</html>
