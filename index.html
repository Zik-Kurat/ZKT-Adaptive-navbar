<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="zk_base_style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <nav class="navbar ZKB_container">

            <div class="navbar__menu">

                <div class="items">
                    <div class="items__item">Товары</div>
                    <div class="items__item">Услуги</div>
                    <div class="items__item">Обратная связь</div>
                    <div class="items__item">Документы</div>
                </div>
                <div class="burger">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="icon icon-tabler icons-tabler-filled icon-tabler-menu-2"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M21 6a1 1 0 0 1 -1 1h-16a1 1 0 1 1 0 -2h16a1 1 0 0 1 1 1" /><path d="M21 12a1 1 0 0 1 -1 1h-16a1 1 0 0 1 0 -2h16a1 1 0 0 1 1 1" /><path d="M21 18a1 1 0 0 1 -1 1h-16a1 1 0 0 1 0 -2h16a1 1 0 0 1 1 1" /></svg>
                </div>

            </div>

        </div>
    </nav>
    
    <div class="navbar_modal navbar_modal--hidden ZKB_modal">

        <div class="ZKB_container ZKB_container--full_screen">
            <div class="ZKB_container__wrapper">

                <div class="navbar_modal__wrapper">
                    <div class="exit">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-x"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M18 6l-12 12" /><path d="M6 6l12 12" /></svg>
                    </div>
                    <div class="items">
                        <div class="items__item">Товары</div>
                        <div class="items__item">Услуги</div>
                        <div class="items__item">Обратная связь</div>
                        <div class="items__item">Документы</div>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- Скрипт открытия/закрытия навбара -->
    <script>
        (()=>{
            const burger = document.querySelector('.navbar .burger');
            const exit   = document.querySelector('.navbar_modal .exit');
            const exitArea = document.querySelector('.navbar_modal .ZKB_container__wrapper');

            const modal = document.querySelector('.navbar_modal');
            const hiddenClass = 'navbar_modal--hidden';

            burger.addEventListener('click', event => {

                modal.classList.remove(hiddenClass);

            });
            exit.addEventListener('click', event => {

                modal.classList.add(hiddenClass);

            });
            exitArea.addEventListener('click', event => {
                if (event.target !== exitArea) return;

                modal.classList.add(hiddenClass);

            });

        })();
    </script>

    <!-- Скрипт адаптивного навбара -->
    <script>
        (()=>{
            // Полезная функция для CSS-анимаций.
            const MAX_TIME = 500;
            async function playAnimation(element, animClass) {
                if (element.clientWidth === 0) return;

                element.classList.add(animClass);
                await Promise.race([
                     new Promise(res => {
                        element.addEventListener('animationend', ()=>{
                            res();
                        }, { once: true });
                    }),
                    new Promise(res => {
                        setTimeout(res, MAX_TIME)
                    }),
                ]);
                element.classList.remove(animClass);
            }

            // ---------------------------------------------------------------------
            // Использование скрипта adaptiveContainer.

            const itemsWrapper      = document.querySelector('.navbar .items');
            const burger            = document.querySelector('.navbar .burger');

            const modalItemsWrapper = document.querySelector('.navbar_modal .items');
            const modal             = document.querySelector('.navbar_modal');

            // Стеки навбара.
            let visibleItemsStack = Array.from(itemsWrapper.children);
            let hiddenItemsStack  = [];
            // Стеки модального навбара.
            let modalVisibleItemsStack = [];
            let modalHiddenItemsStack  = Array.from(modalItemsWrapper.children);

            // Прячим всё что нужно спрятать.
            for (const item of modalHiddenItemsStack) {
                item.classList.add('items__item--hidden');
            }
            burger.classList.add('burger--hidden');

            async function hide() {
                // Показываем бургер (если надо),
                // Прячем итем в основном навбаре,
                // Показываем итем в модальном окне.

                let item      = visibleItemsStack.pop();
                let modalItem = modalHiddenItemsStack.pop();

                modalItem.classList.remove('items__item--hidden');
                await Promise.all([
                    playAnimation(item, 'hide_animation'),
                    playAnimation(modalItem, 'show_animation')
                ]);
                item.classList.add('items__item--hidden');

                hiddenItemsStack.push(item);
                modalVisibleItemsStack.push(modalItem);

                if (hiddenItemsStack.length === 1) {
                    burger.classList.remove('burger--hidden');
                    await playAnimation(burger, 'show_animation');
                }
            }

            async function show() {
                // Прячем бургер (если надо),
                // Показываем итем в основном навбаре,
                // Прячем итем в модальном окне.

                if (hiddenItemsStack.length === 1) {
                    await playAnimation(burger, 'hide_animation');
                    burger.classList.add('burger--hidden');
                    modal.classList.add('navbar_modal--hidden');
                }

                let item      = hiddenItemsStack.pop();
                let modalItem = modalVisibleItemsStack.pop();

                item.classList.remove('items__item--hidden');
                await Promise.all([
                    playAnimation(item, 'show_animation'),
                    playAnimation(modalItem, 'hide_animation')
                ]);
                modalItem.classList.add('items__item--hidden');

                visibleItemsStack.push(item);
                modalHiddenItemsStack.push(modalItem);
            }

            function getShowChange() {
                let changeList = [];
                if (hiddenItemsStack.length === 0) return changeList;

                changeList.push({
                    elem: hiddenItemsStack.at(-1),
                    remove: [ 'items__item--hidden' ]
                });

                if (hiddenItemsStack.length === 1) {
                    changeList.push({
                        elem: burger,
                        add: [ 'burger--hidden' ]
                    });
                }

                return changeList;
            }

            initAdaptiveContainer(
                itemsWrapper,
                hide,
                show,
                getShowChange
            );

            // ---------------------------------------------------------------------
            // Скрипт adaptiveContainer.
            // Даёт возможность отслежить переполнение контейнера.
            // Даёт возможность отслежить момент для возврата сокрытого контента.
            // * Когда нужно скрыть переполняющий контейнер контент, вызывается
            //   асинхронная функция hide() (получаемая от пользователя).
            // * Когда свободного места достаточно для показа скрытого контента,
            //   вызывается функция асинхронная show() (получаемая от пользователя).
            // * Для проверки возможности показа скрытого контента используется функция
            //   getShowChange() (получаемая от пользователя). Она возвращяет список изменений,
            //   после полной отработки функции show().

            // Принцип работы скрипта:
            // * С определённой периодичностью (при ресайзе и/или по таймеру) вызывается обработчик.
            // * Обработчик асинхронный. Пока полностью не завершит свою работу, не может быть вызван
            //   снова.
            // * Обработчик проверяет контейнер на переполнение. Если таковое есть, вызывается
            //   функция hide().
            // * Обработчик првоеряет контейнер на возможность вернуть контент. Если таковая есть,
            //   вызывается функция show().

            // Принцип проверки на наличие свободного места:
            // * Для проверки наличия свободного места под скрытый контент, эмулируется его показ.
            //   Функция getShowChange() возвращяет конечный списко изменений после работы show().
            // * Данные изменения применяются к DOM-элементам, и сразу же производится проверка на
            //   переполнение. Если переполнения нет, считается что есть возможность для вызова
            //   функции show().
            // * Применённые изменения откатываются, и даётся добро на вызов функции show().

            

            function onDeleteNode(target, callback) {
                let observer = new MutationObserver(mutations => {
                    for (const mutation of mutations) {
                        for (const node of mutation.removedNodes) {
                            if (target === node) {
                                callback();
                                observer.disconnect();
                            }
                        }
                    }
                });
                observer.observe(target.parentElement, { childList: true });
            }
            function multiLock(funcArray) {
                let isLock = false;
                let runQueue = [];

                let wrappers = [];
                for (const func of funcArray) {
                    let wrapper = async () => {
                        // Если занято, становимся в очередь.
                        if (isLock) {
                            // Если мы уже в очереди, то гуляем дальше.
                            if (runQueue.find(ticket => ticket.wrapper === wrapper)) return;

                            await new Promise(res => {
                                runQueue.push({ wrapper, res });
                            });
                        };

                        isLock = true;
                        await func();
                        isLock = false;

                        // Когда закончили, пригласили следуюшего.
                        if (runQueue.length !== 0) {
                            let ticket = runQueue.shift();
                            ticket.res();
                        };
                    };

                    wrappers.push(wrapper);
                }

                return wrappers;
            }
            async function delay(ms) {
                return new Promise(res => {
                    setTimeout(res, ms);
                });
            }

            function isOverflow(wrapper) {
                return wrapper.clientWidth < wrapper.scrollWidth;
            }
            function canShow(wrapper, changeFunc) {
                const changeList = changeFunc();
                if (changeList.length === 0) return false;
                
                for (const change of changeList) {
                    let elem = change.elem;

                    if (change.add) for (const className of change.add) {
                        elem.classList.add(className);
                    }
                    if (change.remove) for (const className of change.remove) {
                        elem.classList.remove(className);
                    }
                }

                let result = !isOverflow(wrapper);

                for (const change of changeList) {
                    let elem = change.elem;

                    if (change.remove) for (const className of change.remove) {
                        elem.classList.add(className);
                    }
                    if (change.add) for (const className of change.add) {
                        elem.classList.remove(className);
                    }
                }

                return result;
            }

            function initAdaptiveContainer(container, hide, show, getShowChange) {
                let cancellation = false;
                onDeleteNode(container, () => {
                    cancellation = true;
                });

                let [hideCheck, showCheck] = multiLock([
                    async () => {
                        while(isOverflow(container)) {
                            await hide();
                        }
                    },
                    async () => {
                        while(canShow(container, getShowChange)) {
                            await show();
                        }
                    }
                ]);

                (async()=>{
                    while(true) {
                        if (cancellation) return;

                        await hideCheck();

                        await delay(250);
                    }
                })();
                (async()=>{
                    while(true) {
                        if (cancellation) return;

                        await showCheck();

                        await delay(1000);
                    }
                })();
            }

        })();
    </script>

</body>
</html>
